name: Profile art (3D contributions + snake)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["profile-3d-contrib/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@0.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: shirsha2002
          SETTING_JSON: .github/3d-settings.json

      - name: Blaugrana snake
        uses: Platane/snk@v3
        with:
          github_user_name: shirsha2002
          outputs: |
            profile-3d-contrib/snake.svg?palette=github-dark&color_snake=#EDBB00&color_dots=#161b33,#0b3a75,#004D98,#7a0a3a,#A50044

      - name: Recent activity feed
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          GH_USERNAME: shirsha2002
          MAX_LINES: 8
          COMMIT_NAME: Shirsha Mitra
          COMMIT_EMAIL: 240193888+shirsha2002@users.noreply.github.com
          COMMIT_MSG: "Update activity"

      - name: Commit
        run: |
          git config user.name "Shirsha Mitra"
          git config user.email "240193888+shirsha2002@users.noreply.github.com"
          git add -A profile-3d-contrib
          git commit -m "chore: refresh profile art" || echo "no changes"
          git push
